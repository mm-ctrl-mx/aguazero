<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F7A80"/><stop offset=".6" stop-color="#9DB2B6"/><stop offset="1" stop-color="#C9D6D8"/>
    </linearGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7F4EE"/><stop offset="1" stop-color="#E9E4DA"/>
    </linearGradient>
    <linearGradient id="chorro" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#A9CBE6" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#cielo)"/>
  <!-- humo -->
  <g fill="#E9EEEF" opacity=".55">
    <circle cx="120" cy="560" r="120"/><circle cx="260" cy="600" r="140"/><circle cx="90" cy="700" r="130"/><circle cx="380" cy="690" r="110"/>
  </g>
  <!-- chorro a presión -->
  <path d="M900 250 Q620 270 330 470 L350 500 Q630 320 900 300 Z" fill="url(#chorro)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="360" cy="520" r="9"/><circle cx="330" cy="540" r="6"/><circle cx="390" cy="545" r="7"/><circle cx="300" cy="510" r="5"/>
  </g>
  <rect x="0" y="760" width="900" height="140" fill="#3E4F53"/>
  <path d="M0 790 h900" stroke="#A9CBE6" stroke-width="6" opacity=".4"/>

  <!-- textos -->
  <circle cx="110" cy="105" r="52" fill="#fff"/>
  <path d="M70 128 a46 46 0 0 0 82 -8" stroke="#1DAA3C" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="110" y="101" text-anchor="middle" font-family="Impact,'Arial Narrow',sans-serif" font-size="30" fill="#6487B6">AGUA</text>
  <text x="103" y="130" text-anchor="middle" font-family="Impact,'Arial Narrow',sans-serif" font-size="28" fill="#0B5E62">ZERO</text>
  <text x="58" y="250" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="64" fill="#10292A">Kit</text>
  <text x="58" y="322" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="64" fill="#10292A">Manifestante</text>
  <text x="60" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="#10292A">Para cuando el agua por fin</text>
  <text x="60" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="#10292A">te llega con presión.</text>

  <!-- caja -->
  <path d="M560 380 L800 380 L840 350 L600 350 Z" fill="#DCD5C8"/>
  <path d="M800 380 L840 350 L840 780 L800 800 Z" fill="#0B5E62"/>
  <rect x="560" y="380" width="240" height="420" fill="url(#caja)"/>
  <circle cx="680" cy="450" r="44" fill="#fff" stroke="#E3E9EA" stroke-width="2"/>
  <path d="M646 470 a40 40 0 0 0 72 -6" stroke="#1DAA3C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="680" y="447" text-anchor="middle" font-family="Impact,'Arial Narrow',sans-serif" font-size="24" fill="#6487B6">AGUA</text>
  <text x="674" y="472" text-anchor="middle" font-family="Impact,'Arial Narrow',sans-serif" font-size="23" fill="#0B5E62">ZERO</text>
  <text x="582" y="540" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="30" fill="#10292A">Kit</text>
  <text x="582" y="574" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="30" fill="#10292A">Manifestante</text>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#10292A">
    <circle cx="594" cy="618" r="12" fill="none" stroke="#10292A" stroke-width="2"/><text x="616" y="624">Goggles antiempañantes</text>
    <circle cx="594" cy="656" r="12" fill="none" stroke="#10292A" stroke-width="2"/><text x="616" y="662">Pañuelo de algodón</text>
    <circle cx="594" cy="694" r="12" fill="none" stroke="#10292A" stroke-width="2"/><text x="616" y="700">Resiste chorro</text>
    <text x="616" y="720">de camión de bomberos</text>
  </g>
  <text x="582" y="780" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#6B7778">1 pieza · Talla única</text>

  <!-- íconos a la izquierda -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#10292A">
    <circle cx="90" cy="480" r="28" fill="none" stroke="#10292A" stroke-width="3"/>
    <path d="M78 482 q12 -16 24 0" stroke="#10292A" stroke-width="3" fill="none"/>
    <text x="134" y="478">Llorar</text><text x="134" y="502">es opcional</text>
    <circle cx="300" cy="480" r="28" fill="none" stroke="#10292A" stroke-width="3"/>
    <path d="M300 464 c8 12 10 18 4 24 -7 4 -14 -2 -10 -10z" fill="#10292A"/>
    <text x="344" y="478">Agua con</text><text x="344" y="502">presión real</text>
  </g>
</svg>
